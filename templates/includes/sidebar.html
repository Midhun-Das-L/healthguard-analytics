<aside class="app-sidebar">
  <a class="app-brand" href="{% url 'dashboard' %}">HealthGuard<small>Provider fraud &amp; readmission risk</small></a>
  <nav class="app-nav">
    <div class="section">Overview</div>
    <a href="{% url 'dashboard' %}" class="{% if segment == 'dashboard' %}active{% endif %}">Dashboard</a>
    <div class="section">Provider fraud</div>
    <a href="{% url 'provider_list' %}" class="{% if segment == 'providers' %}active{% endif %}">Provider risk list</a>
    <a href="{% url 'fraud_upload' %}" class="{% if segment == 'upload' %}active{% endif %}">Score new claims</a>
    <div class="section">Patients</div>
    <a href="{% url 'readmission' %}" class="{% if segment == 'readmission' %}active{% endif %}">Readmission risk</a>
    <div class="section">System</div>
    <a href="{% url 'model_performance' %}" class="{% if segment == 'models' %}active{% endif %}">Model performance</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" class="mt-3 px-2">{% csrf_token %}
      <button class="btn btn-sm btn-outline-light w-100 mb-0" type="submit">Sign out{% if user.is_authenticated %} ({{ user.username }}){% endif %}</button>
    </form>
  </nav>
</aside>
