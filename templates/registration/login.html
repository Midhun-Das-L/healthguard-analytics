{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · HealthGuard</title>
<link rel="stylesheet" href="{% static 'css/soft-ui-dashboard.min.css' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card p-4" style="width:360px">
    <h4 class="mb-1">HealthGuard</h4>
    <p class="secondary small mb-3">Healthcare provider fraud &amp; readmission analytics</p>
    {% if form.errors %}<div class="alert alert-danger text-white py-2 small">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <label class="small secondary" for="id_username">Username</label>
      <input class="form-control mb-2" type="text" name="username" id="id_username" autofocus required>
      <label class="small secondary" for="id_password">Password</label>
      <input class="form-control mb-3" type="password" name="password" id="id_password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100 mb-0" type="submit">Sign in</button>
    </form>
  </div>
</body></html>
